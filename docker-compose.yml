name: sura-staging

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: sura-rag:${SURA_IMAGE_TAG:-c02e908}
    restart: unless-stopped
    # API is private — only reachable via reverse proxy network, not exposed to public
    expose:
      - "8000"
    environment:
      SURA_PROFILE: production
      # Secret injected via Docker secret / env_file (never committed)
      # SURA_API_TOKEN is read from /run/secrets/sura_api_token if present
      SURA_API_TOKEN_FILE: /run/secrets/sura_api_token
      SURA_ALLOWED_HOSTS: ${SURA_ALLOWED_HOSTS:?SURA_ALLOWED_HOSTS must be set}
      HOST: "0.0.0.0"
      PORT: "8000"
      RAG_GENERATOR: extractive
      RAG_CORS_ORIGINS: ${RAG_CORS_ORIGINS:-}
      RAG_CSP_FRAME_ANCESTORS: "'none'"
      RAG_ENABLE_DEBUG: "0"
      SURA_LOG_QUERIES: "0"
      SURA_INTENT_AWARE: "0"
      SURA_SECTION_SELECTION: "0"
      SURA_ADDITIONAL_EVIDENCE: "0"
      SURA_MAX_CONCURRENT_REQUESTS: "4"
      SURA_RATE_LIMIT_PER_MINUTE: "60"
      SURA_QUEUE_TIMEOUT_SECONDS: "30"
      RAG_STATIC_DIR: /app/web/dist
      # Explicit persistent-store paths — startup fails closed if missing
      SURA_CARD_VECTOR_DIR: /app/data/vector_store
      SURA_PAGE_VECTOR_DIR: /app/data/vector_store/page_collection
    volumes:
      # Persistent vector stores — provisioned from approved snapshot (read-only)
      - sura_vector_store:/app/data/vector_store:ro
    secrets:
      - sura_api_token
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginx:1.27.3-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal
      - public
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sura_vector_store:
    # External volume provisioned from approved quiesced snapshot.
    # Create via: docker volume create sura_vector_store
    # Restore snapshot: tar -xzf sura-vector-store-<sha>.tar.gz -C $(docker volume inspect sura_vector_store --format '{{.Mountpoint}}')
    # Verify: corpus_sha256 46e7c63af630de1a99f924320092b3bce4e29751add1eb3177b357cabd136008, cards 29, pages 28, chunks 113
    external: true

networks:
  internal:
    internal: true
  public:

secrets:
  sura_api_token:
    file: ./secrets/sura_api_token.txt
    # In production, use external secret manager:
    # external: true
    # name: sura_api_token_v1
