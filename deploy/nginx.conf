# SURA — Nginx private HTTPS reverse proxy
# API is private; gateway authenticates users, injects backend token server-side.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format sura '$remote_addr - $request_id - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /var/log/nginx/access.log sura;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Upstream API (internal only, no public direct access)
    upstream sura_api {
        server api:8000;
    }

    # HTTP -> HTTPS redirect (optional, remove if TLS terminated at LB)
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _; # Replace with SURA_ALLOWED_HOSTS value, e.g. sura-staging.example.com

        # TLS — provision via secret manager / certbot; never commit keys
        ssl_certificate /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # Generate request ID if not supplied by client
        map $http_x_request_id $request_id {
            default $http_x_request_id;
            "" $request_id_guid;
        }

        # Health endpoints — no auth, used for liveness probing (but never expose secrets in URL)
        location = /health {
            proxy_pass http://sura_api/health;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /ready {
            proxy_pass http://sura_api/ready;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API — authenticated at proxy (example: mTLS or IdP); backend token injected server-side
        # Replace auth block with your IdP (e.g., oauth2_proxy, AWS ALB auth)
        location /api/ {
            # Example: require valid IdP session (uncomment and configure)
            # auth_request /auth;
            # error_page 401 = @unauthorized;

            proxy_pass http://sura_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Inject backend secret — never expose to browser; read from Docker secret on api side
            # Nginx itself does not need the token; api validates Authorization from proxy
            proxy_set_header Authorization "Bearer $sura_api_token";
            proxy_read_timeout 60s;
        }

        # Static frontend — served by FastAPI from web/dist, proxied here for consistent TLS/host controls
        location / {
            proxy_pass http://sura_api;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Deny direct access to internal docs
        location ~ /\. { deny all; }
    }
}
